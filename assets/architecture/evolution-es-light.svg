<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560"><rect width="1400" height="560" rx="22" fill="#f1f3f5"/><g font-family="Segoe UI,Arial,sans-serif"><text x="44" y="46" fill="#5f6b76" font-size="14" font-weight="700" letter-spacing="2">OTDR INSIDE · EVOLUCIÓN DE ARQUITECTURA</text><text x="44" y="77" fill="#202a33" font-size="24" font-weight="700">Capas añadidas sin romper la frontera estructural de datos crudos</text><g stroke="#c3c9cf" fill="#e5e8eb"><rect x="36" y="122" width="202" height="300" rx="16"/><rect x="261" y="122" width="202" height="300" rx="16"/><rect x="486" y="122" width="202" height="300" rx="16"/><rect x="711" y="122" width="202" height="300" rx="16"/><rect x="936" y="122" width="202" height="300" rx="16"/><rect x="1161" y="122" width="202" height="300" rx="16"/></g><g font-size="12" font-weight="700"><text x="58" y="154" fill="#2f7f78">v0.1.0–v0.1.2</text><text x="283" y="154" fill="#3f73a6">v0.2.0</text><text x="508" y="154" fill="#675a9e">v0.3.0–v0.3.2</text><text x="733" y="154" fill="#3f73a6">v0.3.3</text><text x="958" y="154" fill="#675a9e">v0.3.4</text><text x="1183" y="154" fill="#2f7f78">v0.3.5</text></g><g font-size="17" font-weight="700" fill="#202a33"><text x="58" y="187">Columna SOR</text><text x="283" y="187">Evidencia semántica</text><text x="508" y="187">Análisis de eventos</text><text x="733" y="187">Segunda entrada EI</text><text x="958" y="187">Diagnóstico terminal</text><text x="1183" y="187">Evidencia de final</text></g><g fill="#5f6b76" font-size="13"><text x="58" y="220">scanner → perfiles</text><text x="58" y="242">→ traza → visor</text><text x="58" y="278">0.1.1/0.1.2 endurecen</text><text x="58" y="300">ejecución y arranque.</text><text x="283" y="220">Estado por capacidad,</text><text x="283" y="242">confianza y crudo/</text><text x="283" y="264">normalizado separados.</text><text x="283" y="300">Leer ≠ interpretar.</text><text x="508" y="220">Candidatos calculados,</text><text x="508" y="242">evidencia, revisión</text><text x="508" y="264">y lógica contextual.</text><text x="508" y="300">Decisiones explicables.</text><text x="733" y="220">Lector EI defensivo,</text><text x="733" y="242">pareja por contenido</text><text x="733" y="264">y procedencia propia.</text><text x="733" y="300">Modelo multifuente.</text><text x="958" y="220">D1 navegable y</text><text x="958" y="242">localización multiescala.</text><text x="958" y="278">Sensibilidad ≠</text><text x="958" y="300">incertidumbre.</text><text x="1183" y="220">Final no reflectivo</text><text x="1183" y="242">como candidato si</text><text x="1183" y="264">coinciden borde, caída</text><text x="1183" y="286">y ruido persistente.</text><text x="1183" y="322">Si no: D diagnóstico.</text></g><g stroke="#7a8793" stroke-width="2.3" fill="none"><path d="M238 272H251M463 272H476M688 272H701M913 272H926M1138 272H1151"/></g><g fill="#2f7f78"><path d="M251 272l-9-6v12zM476 272l-9-6v12zM701 272l-9-6v12zM926 272l-9-6v12zM1151 272l-9-6v12z"/></g><rect x="170" y="460" width="1060" height="48" rx="12" fill="#dde2e6" stroke="#c3c9cf"/><text x="700" y="489" text-anchor="middle" fill="#5f6b76" font-size="14" font-weight="600">Entregas documentadas hasta v0.3.5 · la arquitectura sigue evolucionando</text></g></svg>