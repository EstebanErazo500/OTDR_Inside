<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="475" viewBox="0 0 1440 475"><rect width="1440" height="475" rx="20" fill="#131820"/><g font-family="Segoe UI,Arial,sans-serif"><text x="43" y="43" fill="#acb6c1" font-size="15" font-weight="700" letter-spacing="1.4">OTDR INSIDE · DOCUMENTED 4.2 LAYERS</text><text x="43" y="82" fill="#f0f4f6" font-size="26" font-weight="700">Explainable extensions around the preserved baseline</text><rect x="40" y="116" width="435" height="130" rx="14" fill="#252c35" stroke="#46515e"/><rect x="40" y="116" width="6" height="130" rx="3" fill="#80d2c3"/><text x="64" y="146" font-size="12" font-weight="700" fill="#80d2c3">v0.4.1 VIEWER BASE</text><text x="64" y="187" font-size="19" font-weight="700" fill="#f0f4f6">Positions and classes preserved</text><text x="64" y="218" font-size="13" fill="#acb6c1">Default detector · EI remains separate</text><rect x="510" y="116" width="435" height="130" rx="14" fill="#252c35" stroke="#46515e"/><rect x="510" y="116" width="6" height="130" rx="3" fill="#80d2c3"/><text x="534" y="146" font-size="12" font-weight="700" fill="#80d2c3">v0.4.2 AUDIT</text><text x="534" y="187" font-size="19" font-weight="700" fill="#f0f4f6">Excluded and graded proposals</text><text x="534" y="218" font-size="13" fill="#acb6c1">Rule + position; not counted as matches</text><rect x="980" y="116" width="435" height="130" rx="14" fill="#252c35" stroke="#46515e"/><rect x="980" y="116" width="6" height="130" rx="3" fill="#80d2c3"/><text x="1004" y="146" font-size="12" font-weight="700" fill="#80d2c3">TERMINAL SENSITIVITY</text><text x="1004" y="187" font-size="19" font-weight="700" fill="#f0f4f6">Minimum noise threshold ±10%</text><text x="1004" y="218" font-size="13" fill="#acb6c1">Diagnostic warning; not recalibration</text><rect x="40" y="270" width="435" height="130" rx="14" fill="#252c35" stroke="#46515e"/><rect x="40" y="270" width="6" height="130" rx="3" fill="#a69ff0"/><text x="64" y="300" font-size="12" font-weight="700" fill="#a69ff0">CLASS-AWARE EDGE</text><text x="64" y="341" font-size="19" font-weight="700" fill="#f0f4f6">Experimental reversible method</text><text x="64" y="372" font-size="13" fill="#acb6c1">Moves selected positions, not origins</text><rect x="510" y="270" width="435" height="130" rx="14" fill="#252c35" stroke="#46515e"/><rect x="510" y="270" width="6" height="130" rx="3" fill="#80d2c3"/><text x="534" y="300" font-size="12" font-weight="700" fill="#80d2c3">SESSION AND REPORTS</text><text x="534" y="341" font-size="19" font-weight="700" fill="#f0f4f6">Method and changes recorded</text><text x="534" y="372" font-size="13" fill="#acb6c1">Sessions · comparison · vector PDF</text><rect x="980" y="270" width="435" height="130" rx="14" fill="#252c35" stroke="#46515e"/><rect x="980" y="270" width="6" height="130" rx="3" fill="#80d2c3"/><text x="1004" y="300" font-size="12" font-weight="700" fill="#80d2c3">EVIDENCE LIMIT</text><text x="1004" y="341" font-size="19" font-weight="700" fill="#f0f4f6">EXFO improves; EI worsens</text><text x="1004" y="372" font-size="13" fill="#acb6c1">Concordance ≠ physical accuracy</text><text x="720" y="456" text-anchor="middle" fill="#acb6c1" font-size="13">Default baseline · traceable optional changes · ongoing development</text></g></svg>