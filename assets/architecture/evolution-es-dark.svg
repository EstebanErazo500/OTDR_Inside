<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520"><rect width="1400" height="520" rx="22" fill="#11161d"/><g font-family="Segoe UI,Arial,sans-serif"><text x="48" y="48" fill="#a5b0ba" font-size="14" font-weight="700" letter-spacing="2">OTDR INSIDE · EVOLUCIÓN DE ARQUITECTURA</text><text x="48" y="78" fill="#f0f3f5" font-size="24" font-weight="700">De una lectura SOR estable a un análisis multifuente con procedencia explícita</text><g stroke="#434d57" fill="#232931"><rect x="45" y="125" width="238" height="275" rx="16"/><rect x="315" y="125" width="238" height="275" rx="16"/><rect x="585" y="125" width="238" height="275" rx="16"/><rect x="855" y="125" width="238" height="275" rx="16"/><rect x="1125" y="125" width="230" height="275" rx="16"/></g><g font-size="13" font-weight="700"><text x="68" y="158" fill="#65d6c3">v0.1.0–v0.1.2</text><text x="338" y="158" fill="#72b7ef">v0.2.0</text><text x="608" y="158" fill="#a48cff">v0.3.0–v0.3.2</text><text x="878" y="158" fill="#72b7ef">v0.3.3</text><text x="1148" y="158" fill="#65d6c3">v0.3.4</text></g><g fill="#f0f3f5" font-size="19" font-weight="700"><text x="68" y="190">Columna estructural</text><text x="338" y="190">Evidencia semántica</text><text x="608" y="190">Rama de eventos</text><text x="878" y="190">Segunda entrada</text><text x="1148" y="190">Diagnóstico terminal</text></g><g fill="#a5b0ba" font-size="14"><text x="68" y="226">SOR → scanner → perfiles</text><text x="68" y="249">→ traza → visor</text><text x="68" y="285">0.1.1 / 0.1.2 robustecen</text><text x="68" y="308">ejecución y arranque, no</text><text x="68" y="331">el núcleo de análisis.</text><text x="338" y="226">Estado por capacidad,</text><text x="338" y="249">evidencia de perfil y</text><text x="338" y="272">separación crudo/normalizado.</text><text x="338" y="308">Leer estructura deja de</text><text x="338" y="331">equivaler a soporte semántico.</text><text x="608" y="226">Candidatos calculados se</text><text x="608" y="249">separan de eventos almacenados.</text><text x="608" y="285">Base → evidencia/revisión</text><text x="608" y="308">→ lógica híbrida contextual.</text><text x="878" y="226">Lector EI defensivo y</text><text x="878" y="249">emparejamiento EI/SOR</text><text x="878" y="272">basado en contenido.</text><text x="878" y="308">EI adquiere procedencia propia.</text><text x="1148" y="226">Región terminal D1,</text><text x="1148" y="249">localización multiescala</text><text x="1148" y="272">y diagnósticos alineados.</text><text x="1148" y="308">Instantánea documentada de</text><text x="1148" y="331">una línea aún en desarrollo.</text></g><g stroke="#53677a" stroke-width="2.5" fill="none"><path d="M283 263H300M553 263H570M823 263H840M1093 263H1110"/></g><g fill="#65d6c3"><path d="M300 263l-10-6v12zM570 263l-10-6v12zM840 263l-10-6v12zM1110 263l-10-6v12z"/></g><rect x="120" y="432" width="1160" height="44" rx="12" fill="#1b2128" stroke="#434d57"/><text x="700" y="460" text-anchor="middle" fill="#a5b0ba" font-size="14" font-weight="600">La frontera estructural se conserva mientras interpretación, procedencia y diagnóstico crecen alrededor de ella</text></g></svg>