<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="600" viewBox="0 0 1680 600"><rect width="1680" height="600" rx="22" fill="#11161d"/><g font-family="Segoe UI,Arial,sans-serif"><text x="44" y="45" fill="#a5b0ba" font-size="14" font-weight="700" letter-spacing="2">OTDR INSIDE · EVOLUCIÓN DE ARQUITECTURA</text><text x="44" y="79" fill="#f0f3f5" font-size="25" font-weight="700">Capas añadidas sobre una frontera estructural estable</text><rect x="32" y="118" width="220" height="330" rx="16" fill="#232931" stroke="#434d57"/><text x="52" y="152" fill="#65d6c3" font-size="12" font-weight="700">v0.1.0–0.1.2</text><text x="52" y="188" fill="#f0f3f5" font-size="17" font-weight="700">Columna estructural</text><text x="52" y="234" fill="#a5b0ba" font-size="13">scanner → perfiles</text><text x="52" y="262" fill="#a5b0ba" font-size="13">→ traza → visor</text><text x="52" y="290" fill="#a5b0ba" font-size="13">arranque endurecido</text><path d="M252 298H261" stroke="#53677a" stroke-width="2.3"/><path d="M266 298l-9-6v12z" fill="#65d6c3"/><rect x="266" y="118" width="220" height="330" rx="16" fill="#232931" stroke="#434d57"/><text x="286" y="152" fill="#72b7ef" font-size="12" font-weight="700">v0.2.0</text><text x="286" y="188" fill="#f0f3f5" font-size="17" font-weight="700">Evidencia semántica</text><text x="286" y="234" fill="#a5b0ba" font-size="13">soporte por capacidad</text><text x="286" y="262" fill="#a5b0ba" font-size="13">crudo/normalizado</text><text x="286" y="290" fill="#a5b0ba" font-size="13">leer ≠ interpretar</text><path d="M486 298H495" stroke="#53677a" stroke-width="2.3"/><path d="M500 298l-9-6v12z" fill="#65d6c3"/><rect x="500" y="118" width="220" height="330" rx="16" fill="#232931" stroke="#434d57"/><text x="520" y="152" fill="#a48cff" font-size="12" font-weight="700">v0.3.0–0.3.2</text><text x="520" y="188" fill="#f0f3f5" font-size="17" font-weight="700">Eventos calculados</text><text x="520" y="234" fill="#a5b0ba" font-size="13">candidatos · evidencia</text><text x="520" y="262" fill="#a5b0ba" font-size="13">revisión · contexto</text><text x="520" y="290" fill="#a5b0ba" font-size="13">decisiones explicables</text><path d="M720 298H729" stroke="#53677a" stroke-width="2.3"/><path d="M734 298l-9-6v12z" fill="#65d6c3"/><rect x="734" y="118" width="220" height="330" rx="16" fill="#232931" stroke="#434d57"/><text x="754" y="152" fill="#72b7ef" font-size="12" font-weight="700">v0.3.3</text><text x="754" y="188" fill="#f0f3f5" font-size="17" font-weight="700">Segunda fuente EI</text><text x="754" y="234" fill="#a5b0ba" font-size="13">lector defensivo</text><text x="754" y="262" fill="#a5b0ba" font-size="13">pareja por contenido</text><text x="754" y="290" fill="#a5b0ba" font-size="13">procedencia propia</text><path d="M954 298H963" stroke="#53677a" stroke-width="2.3"/><path d="M968 298l-9-6v12z" fill="#65d6c3"/><rect x="968" y="118" width="220" height="330" rx="16" fill="#232931" stroke="#434d57"/><text x="988" y="152" fill="#a48cff" font-size="12" font-weight="700">v0.3.4–0.3.6</text><text x="988" y="188" fill="#f0f3f5" font-size="17" font-weight="700">Terminal + consistencia</text><text x="988" y="234" fill="#a5b0ba" font-size="13">diagnóstico/evidencia</text><text x="988" y="262" fill="#a5b0ba" font-size="13">localización multiescala</text><text x="988" y="290" fill="#a5b0ba" font-size="13">EI/SOR consistente</text><path d="M1188 298H1197" stroke="#53677a" stroke-width="2.3"/><path d="M1202 298l-9-6v12z" fill="#65d6c3"/><rect x="1202" y="118" width="220" height="330" rx="16" fill="#232931" stroke="#434d57"/><text x="1222" y="152" fill="#65d6c3" font-size="12" font-weight="700">v0.4.0</text><text x="1222" y="188" fill="#f0f3f5" font-size="17" font-weight="700">Espacio multiarchivo</text><text x="1222" y="234" fill="#a5b0ba" font-size="13">hasta 8 pestañas</text><text x="1222" y="262" fill="#a5b0ba" font-size="13">comparación 2–4</text><text x="1222" y="290" fill="#a5b0ba" font-size="13">EI asociado explícito</text><pat