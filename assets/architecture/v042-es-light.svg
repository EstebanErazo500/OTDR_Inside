<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="475" viewBox="0 0 1440 475"><rect width="1440" height="475" rx="20" fill="#f3f5f7"/><g font-family="Segoe UI,Arial,sans-serif"><text x="43" y="43" fill="#596774" font-size="15" font-weight="700" letter-spacing="1.4">OTDR INSIDE · CAPAS DOCUMENTADAS DE 4.2</text><text x="43" y="82" fill="#22303b" font-size="26" font-weight="700">Una extensión explicable sobre una lectura base conservada</text><rect x="40" y="116" width="435" height="130" rx="14" fill="#e7ebee" stroke="#c0c9d1"/><rect x="40" y="116" width="6" height="130" rx="3" fill="#287a71"/><text x="64" y="146" font-size="12" font-weight="700" fill="#287a71">BASE DEL VISOR 4.1</text><text x="64" y="187" font-size="19" font-weight="700" fill="#22303b">Posiciones y clases conservadas</text><text x="64" y="218" font-size="13" fill="#596774">Detector predeterminado · EI aparte</text><rect x="510" y="116" width="435" height="130" rx="14" fill="#e7ebee" stroke="#c0c9d1"/><rect x="510" y="116" width="6" height="130" rx="3" fill="#287a71"/><text x="534" y="146" font-size="12" font-weight="700" fill="#287a71">AUDITORÍA 4.2</text><text x="534" y="187" font-size="19" font-weight="700" fill="#22303b">Excluidos y grados visibles</text><text x="534" y="218" font-size="13" fill="#596774">Regla + posición; no cuentan como pareja</text><rect x="980" y="116" width="435" height="130" rx="14" fill="#e7ebee" stroke="#c0c9d1"/><rect x="980" y="116" width="6" height="130" rx="3" fill="#287a71"/><text x="1004" y="146" font-size="12" font-weight="700" fill="#287a71">SENSIBILIDAD TERMINAL</text><text x="1004" y="187" font-size="19" font-weight="700" fill="#22303b">Umbral mínimo de ruido ±10 %</text><text x="1004" y="218" font-size="13" fill="#596774">Aviso diagnóstico; no recalibración</text><rect x="40" y="270" width="435" height="130" rx="14" fill="#e7ebee" stroke="#c0c9d1"/><rect x="40" y="270" width="6" height="130" rx="3" fill="#6756a1"/><text x="64" y="300" font-size="12" font-weight="700" fill="#6756a1">BORDE POR CLASE</text><text x="64" y="341" font-size="19" font-weight="700" fill="#22303b">Método experimental y reversible</text><text x="64" y="372" font-size="13" fill="#596774">Cambia posiciones seleccionadas, no origen</text><rect x="510" y="270" width="435" height="130" rx="14" fill="#e7ebee" stroke="#c0c9d1"/><rect x="510" y="270" width="6" height="130" rx="3" fill="#287a71"/><text x="534" y="300" font-size="12" font-weight="700" fill="#287a71">ESTADO E INFORMES</text><text x="534" y="341" font-size="19" font-weight="700" fill="#22303b">Método y cambios registrados</text><text x="534" y="372" font-size="13" fill="#596774">Sesiones · comparación · PDF vectorial</text><rect x="980" y="270" width="435" height="130" rx="14" fill="#e7ebee" stroke="#c0c9d1"/><rect x="980" y="270" width="6" height="130" rx="3" fill="#287a71"/><text x="1004" y="300" font-size="12" font-weight="700" fill="#287a71">LÍMITE DE LA EVIDENCIA</text><text x="1004" y="341" font-size="19" font-weight="700" fill="#22303b">EXFO mejora; EI empeora</text><text x="1004" y="372" font-size="13" fill="#596774">Concordancia ≠ exactitud física</text><text x="720" y="456" text-anchor="middle" fill="#596774" font-size="13">Lectura base predeterminada · cambios opcionales trazables · proyecto en desarrollo</text></g></svg>