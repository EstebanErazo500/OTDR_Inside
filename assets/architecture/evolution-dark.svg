<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520"><rect width="1400" height="520" rx="22" fill="#11161d"/><g font-family="Segoe UI,Arial,sans-serif"><text x="48" y="48" fill="#a5b0ba" font-size="14" font-weight="700" letter-spacing="2">OTDR INSIDE · ARCHITECTURE EVOLUTION</text><text x="48" y="78" fill="#f0f3f5" font-size="24" font-weight="700">From stable SOR parsing to provenance-aware multi-source analysis</text><g stroke="#434d57" fill="#232931"><rect x="45" y="125" width="238" height="275" rx="16"/><rect x="315" y="125" width="238" height="275" rx="16"/><rect x="585" y="125" width="238" height="275" rx="16"/><rect x="855" y="125" width="238" height="275" rx="16"/><rect x="1125" y="125" width="230" height="275" rx="16"/></g><g font-size="13" font-weight="700"><text x="68" y="158" fill="#65d6c3">v0.1.0–v0.1.2</text><text x="338" y="158" fill="#72b7ef">v0.2.0</text><text x="608" y="158" fill="#a48cff">v0.3.0–v0.3.2</text><text x="878" y="158" fill="#72b7ef">v0.3.3</text><text x="1148" y="158" fill="#65d6c3">v0.3.4</text></g><g fill="#f0f3f5" font-size="19" font-weight="700"><text x="68" y="190">Structural spine</text><text x="338" y="190">Semantic evidence</text><text x="608" y="190">Event-analysis branch</text><text x="878" y="190">Second input path</text><text x="1148" y="190">Terminal diagnostics</text></g><g fill="#a5b0ba" font-size="14"><text x="68" y="226">SOR → scanner → profiles</text><text x="68" y="249">→ trace → viewer</text><text x="68" y="285">0.1.1 / 0.1.2 harden</text><text x="68" y="308">runtime and launch flow,</text><text x="68" y="331">not the analysis core.</text><text x="338" y="226">Capability-level status,</text><text x="338" y="249">profile evidence and</text><text x="338" y="272">raw / normalized separation.</text><text x="338" y="308">Readable structure no longer</text><text x="338" y="331">implies semantic support.</text><text x="608" y="226">Calculated candidates split</text><text x="608" y="249">from stored events.</text><text x="608" y="285">Baseline → evidence/review</text><text x="608" y="308">→ contextual hybrid logic.</text><text x="878" y="226">Defensive EI reader plus</text><text x="878" y="249">content-based EI/SOR pairing.</text><text x="878" y="285">EI information becomes a</text><text x="878" y="308">separate provenance source.</text><text x="1148" y="226">Terminal D1 region,</text><text x="1148" y="249">multiscale localization</text><text x="1148" y="272">and aligned diagnostics.</text><text x="1148" y="308">Documented snapshot in an</text><text x="1148" y="331">active development line.</text></g><g stroke="#53677a" stroke-width="2.5" fill="none"><path d="M283 263H300M553 263H570M823 263H840M1093 263H1110"/></g><g fill="#65d6c3"><path d="M300 263l-10-6v12zM570 263l-10-6v12zM840 263l-10-6v12zM1110 263l-10-6v12z"/></g><rect x="120" y="432" width="1160" height="44" rx="12" fill="#1b2128" stroke="#434d57"/><text x="700" y="460" text-anchor="middle" fill="#a5b0ba" font-size="14" font-weight="600">Stable structural boundary preserved while interpretation, provenance and diagnostics expand around it</text></g></svg>