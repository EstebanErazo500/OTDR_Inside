<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560"><rect width="1400" height="560" rx="22" fill="#11161d"/><g font-family="Segoe UI,Arial,sans-serif"><text x="44" y="46" fill="#a5b0ba" font-size="14" font-weight="700" letter-spacing="2">OTDR INSIDE · ARCHITECTURE EVOLUTION</text><text x="44" y="77" fill="#f0f3f5" font-size="24" font-weight="700">Layers added without breaking the structural raw-data boundary</text><g stroke="#434d57" fill="#232931"><rect x="36" y="122" width="202" height="300" rx="16"/><rect x="261" y="122" width="202" height="300" rx="16"/><rect x="486" y="122" width="202" height="300" rx="16"/><rect x="711" y="122" width="202" height="300" rx="16"/><rect x="936" y="122" width="202" height="300" rx="16"/><rect x="1161" y="122" width="202" height="300" rx="16"/></g><g font-size="12" font-weight="700"><text x="58" y="154" fill="#65d6c3">v0.1.0–v0.1.2</text><text x="283" y="154" fill="#72b7ef">v0.2.0</text><text x="508" y="154" fill="#a48cff">v0.3.0–v0.3.2</text><text x="733" y="154" fill="#72b7ef">v0.3.3</text><text x="958" y="154" fill="#a48cff">v0.3.4</text><text x="1183" y="154" fill="#65d6c3">v0.3.5</text></g><g font-size="17" font-weight="700" fill="#f0f3f5"><text x="58" y="187">Structural spine</text><text x="283" y="187">Semantic evidence</text><text x="508" y="187">Event analysis</text><text x="733" y="187">Second EI input</text><text x="958" y="187">Terminal diagnostics</text><text x="1183" y="187">End evidence</text></g><g fill="#a5b0ba" font-size="13"><text x="58" y="220">scanner → profiles</text><text x="58" y="242">→ trace → viewer</text><text x="58" y="278">0.1.1/0.1.2 harden</text><text x="58" y="300">runtime and startup.</text><text x="283" y="220">Capability status,</text><text x="283" y="242">confidence and raw/</text><text x="283" y="264">normalized separation.</text><text x="283" y="300">Read ≠ interpret.</text><text x="508" y="220">Calculated candidates,</text><text x="508" y="242">evidence, review</text><text x="508" y="264">and contextual logic.</text><text x="508" y="300">Explainable decisions.</text><text x="733" y="220">Defensive EI reader,</text><text x="733" y="242">content-based pairing</text><text x="733" y="264">and separate provenance.</text><text x="733" y="300">Multi-source model.</text><text x="958" y="220">Navigable D1 and</text><text x="958" y="242">multiscale localization.</text><text x="958" y="278">Sensitivity ≠</text><text x="958" y="300">uncertainty.</text><text x="1183" y="220">Non-reflective end as</text><text x="1183" y="242">candidate when edge,</text><text x="1183" y="264">decline and persistent</text><text x="1183" y="286">noise agree.</text><text x="1183" y="322">Else: D diagnostic.</text></g><g stroke="#53677a" stroke-width="2.3" fill="none"><path d="M238 272H251M463 272H476M688 272H701M913 272H926M1138 272H1151"/></g><g fill="#65d6c3"><path d="M251 272l-9-6v12zM476 272l-9-6v12zM701 272l-9-6v12zM926 272l-9-6v12zM1151 272l-9-6v12z"/></g><rect x="170" y="460" width="1060" height="48" rx="12" fill="#1b2128" stroke="#434d57"/><text x="700" y="489" text-anchor="middle" fill="#a5b0ba" font-size="14" font-weight="600">Snapshots documented through v0.3.5 · architecture continues to evolve</text></g></svg>