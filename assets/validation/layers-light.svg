<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720"><rect width="1500" height="720" rx="22" fill="#f1f3f5"/><g font-family="Segoe UI,Arial,sans-serif"><text x="45" y="44" fill="#5f6b76" font-size="14" font-weight="700" letter-spacing="2">OTDR INSIDE · VALIDATION HIERARCHY</text><text x="45" y="80" fill="#202a33" font-size="25" font-weight="700">Each claim needs the right kind of evidence</text><rect x="55" y="135" width="205" height="120" rx="15" fill="#e5e8eb" stroke="#c3c9cf"/><text x="75" y="169" fill="#2f7f78" font-size="12" font-weight="700">1 · STRUCTURE</text><text x="75" y="207" fill="#202a33" font-size="15" font-weight="700">bounds · blocks · failures</text><path d="M260 195L283 230" stroke="#7a8793" stroke-width="2.2"/><rect x="293" y="170" width="205" height="120" rx="15" fill="#e5e8eb" stroke="#c3c9cf"/><text x="313" y="204" fill="#2f7f78" font-size="12" font-weight="700">2 · SEMANTICS</text><text x="313" y="242" fill="#202a33" font-size="15" font-weight="700">profiles · raw/normalized</text><path d="M498 230L521 265" stroke="#7a8793" stroke-width="2.2"/><rect x="531" y="205" width="205" height="120" rx="15" fill="#e5e8eb" stroke="#c3c9cf"/><text x="551" y="239" fill="#3f73a6" font-size="12" font-weight="700">3 · TRACE</text><text x="551" y="277" fill="#202a33" font-size="15" font-weight="700">samples · distance · determinism</text><path d="M736 265L759 300" stroke="#7a8793" stroke-width="2.2"/><rect x="769" y="240" width="205" height="120" rx="15" fill="#e5e8eb" stroke="#c3c9cf"/><text x="789" y="274" fill="#3f73a6" font-size="12" font-weight="700">4 · EVENTS</text><text x="789" y="312" fill="#202a33" font-size="15" font-weight="700">candidates · terminal · suppression</text><path d="M974 300L997 335" stroke="#7a8793" stroke-width="2.2"/><rect x="1007" y="275" width="205" height="120" rx="15" fill="#e5e8eb" stroke="#c3c9cf"/><text x="1027" y="309" fill="#675a9e" font-size="12" font-weight="700">5 · EI/SOR</text><text x="1027" y="347" fill="#202a33" font-size="15" font-weight="700">pairing · consistency · provenance</text><path d="M1212 335L1235 370" stroke="#7a8793" stroke-width="2.2"/><rect x="1245" y="310" width="205" height="120" rx="15" fill="#e5e8eb" stroke="#c3c9cf"/><text x="1265" y="344" fill="#675a9e" font-size="12" font-weight="700">6 · WORKSPACE</text><text x="1265" y="382" fill="#202a33" font-size="15" font-weight="700">tabs · comparison · UI</text><rect x="145" y="490" width="510" height="100" rx="16" fill="#e5e8eb" stroke="#c3c9cf"/><text x="170" y="526" fill="#2f7f78" font-size="13" font-weight="700">PUBLIC EVIDENCE</text><text x="170" y="563" fill="#202a33" font-size="16" font-weight="700">synthetic/sanitized fixtures · reproducible regression</text><rect x="845" y="490" width="510" height="100" rx="16" fill="#e5e8eb" stroke="#c3c9cf"/><text x="870" y="526" fill="#675a9e" font-size="13" font-weight="700">PRIVATE EVIDENCE</text><text x="870" y="563" fill="#202a33" font-size="16" font-weight="700">real corpora · references · controlled pairs</text><rect x="315" y="625" width="870" height="50" rx="12" fill="#dde2e6" stroke="#c3c9cf"/><text x="750" y="646" text-anchor="middle" fill="#2f7f78" font-size="12" font-weight="700">LIMIT</text><text x="750" y="665" text-anchor="middle" fill="#5f6b76" font-size="12">documented concordance ≠ universal metrological calibration</text></g></svg>