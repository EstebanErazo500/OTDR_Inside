<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 430" width="1440" height="430"><rect x="0" y="0" width="1440" height="430" rx="20" fill="#151b21"/><g font-family="Segoe UI,Arial,sans-serif"><text x="48" y="45" fill="#b0bac3" font-size="13.5" font-weight="700" letter-spacing="2">OTDR INSIDE · FRONTERA DE PUBLICACIÓN</text><text x="48" y="81" fill="#edf0f3" font-size="23" font-weight="700">El permiso de mostrar la interfaz no autoriza publicar sus datos ni su código</text><rect x="47" y="120" width="448" height="227" rx="14" fill="#252c34" stroke="#48535e" stroke-width="1.4"/><rect x="63" y="139" width="5" height="29" rx="2" fill="#86d0bd"/><text x="81" y="160" font-size="13.5" font-weight="700" fill="#86d0bd">PUBLICABLE</text><text x="71" y="205" font-size="20" font-weight="700" fill="#edf0f3">Información de alto nivel</text><text x="71" y="243" font-size="14" fill="#b0bac3">• Objetivos e historial técnico</text><text x="71" y="272" font-size="14" fill="#b0bac3">• Diagramas conceptuales</text><text x="71" y="301" font-size="14" fill="#b0bac3">• Trazas completamente sintéticas</text><rect x="521" y="120" width="448" height="227" rx="14" fill="#252c34" stroke="#48535e" stroke-width="1.4"/><rect x="537" y="139" width="5" height="29" rx="2" fill="#e4ca87"/><text x="555" y="160" font-size="13.5" font-weight="700" fill="#e4ca87">REVISIÓN OBLIGATORIA</text><text x="545" y="205" font-size="20" font-weight="700" fill="#edf0f3">Capturas y resultados</text><text x="545" y="243" font-size="14" fill="#b0bac3">• Interfaz real sin datos sensibles</text><text x="545" y="272" font-size="14" fill="#b0bac3">• Cifras de validación agregadas</text><text x="545" y="301" font-size="14" fill="#b0bac3">• Metadatos y contenido inspeccionados</text><rect x="995" y="120" width="448" height="227" rx="14" fill="#252c34" stroke="#48535e" stroke-width="1.4"/><rect x="1011" y="139" width="5" height="29" rx="2" fill="#d9a6a6"/><text x="1029" y="160" font-size="13.5" font-weight="700" fill="#d9a6a6">NO PUBLICAR</text><text x="1019" y="205" font-size="20" font-weight="700" fill="#edf0f3">Implementación y mediciones</text><text x="1019" y="243" font-size="14" fill="#b0bac3">• Código fuente y archivos internos</text><text x="1019" y="272" font-size="14" fill="#b0bac3">• SOR · EI · sesiones y exportaciones</text><text x="1019" y="301" font-size="14" fill="#b0bac3">• IDs · rutas · seriales · software ajeno</text><rect x="47" y="367" width="1344" height="42" rx="10" fill="#202730" stroke="#48535e"/><text x="719" y="393" text-anchor="middle" font-size="13.5" fill="#b0bac3" font-weight="600">En caso de duda: mantener privado · revisar permiso y contenido antes del commit</text></g></svg>