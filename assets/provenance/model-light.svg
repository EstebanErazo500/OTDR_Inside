<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760"><rect width="1600" height="760" rx="22" fill="#f1f3f5"/><g font-family="Segoe UI,Arial,sans-serif"><text x="48" y="46" fill="#5f6b76" font-size="14" font-weight="700" letter-spacing="2">OTDR INSIDE · EVENT PROVENANCE MODEL</text><text x="48" y="80" fill="#202a33" font-size="26" font-weight="700">Different origins can coexist without becoming the same kind of evidence</text><g stroke="#c3c9cf" fill="#e5e8eb"><rect x="55" y="130" width="330" height="260" rx="18"/><rect x="425" y="130" width="330" height="260" rx="18"/><rect x="795" y="130" width="350" height="350" rx="18"/><rect x="1185" y="130" width="360" height="260" rx="18"/></g><text x="82" y="166" fill="#2f7f78" font-size="13" font-weight="700">SOR STORED</text><text x="82" y="201" fill="#202a33" font-size="21" font-weight="700">Serialized in the SOR</text><text x="82" y="236" fill="#5f6b76" font-size="14">Example: KeyEvents when present</text><text x="82" y="270" fill="#5f6b76" font-size="14">Origin = source file structure</text><text x="82" y="304" fill="#5f6b76" font-size="14">Absence of KeyEvents ≠ no optical events</text><rect x="82" y="330" width="250" height="36" rx="10" fill="#dde2e6" stroke="#c3c9cf"/><text x="207" y="353" text-anchor="middle" fill="#202a33" font-size="12" font-weight="600">origin remains SOR STORED</text><text x="452" y="166" fill="#806d43" font-size="13" font-weight="700">EI IMPORTED</text><text x="452" y="201" fill="#202a33" font-size="21" font-weight="700">Read from supported EI</text><text x="452" y="236" fill="#5f6b76" font-size="14">Standalone EI or verified companion</text><text x="452" y="270" fill="#5f6b76" font-size="14">Pairing requires content + metadata</text><text x="452" y="304" fill="#5f6b76" font-size="14">Imported does not overwrite SOR data</text><rect x="452" y="330" width="250" height="36" rx="10" fill="#dde2e6" stroke="#c3c9cf"/><text x="577" y="353" text-anchor="middle" fill="#202a33" font-size="12" font-weight="600">origin remains EI IMPORTED</text><text x="822" y="166" fill="#675a9e" font-size="13" font-weight="700">CALCULATED</text><text x="822" y="201" fill="#202a33" font-size="21" font-weight="700">Derived from the trace</text><text x="822" y="236" fill="#5f6b76" font-size="14">Detector → context → evidence</text><text x="822" y="270" fill="#5f6b76" font-size="14">Candidate events are not instrument records</text><rect x="822" y="307" width="296" height="132" rx="14" fill="#ece8f5" stroke="#c9c0df"/><text x="846" y="338" fill="#675a9e" font-size="12" font-weight="700">v0.3.5 TERMINAL EVIDENCE</text><text x="846" y="370" fill="#202a33" font-size="16" font-weight="700">Possible non-reflective end</text><text x="846" y="399" fill="#5f6b76" font-size="13">Only when edge/drop/noise evidence aligns</text><text x="846" y="424" fill="#5f6b76" font-size="13">Otherwise the region remains diagnostic D</text><text x="1212" y="166" fill="#3f73a6" font-size="13" font-weight="700">MANUAL REVIEW</text><text x="1212" y="201" fill="#202a33" font-size="21" font-weight="700">Human assessment</text><text x="1212" y="236" fill="#5f6b76" font-size="14">pending · accepted · rejected</text><text x="1212" y="270" fill="#5f6b76" font-size="14">Comments and history stay separate</text><text x="1212" y="304" fill="#5f6b76" font-size="14">Review does not rewrite provenance</text><rect x="1212" y="330" width="275" height="36" rx="10" fill="#dde2e6" stroke="#c3c9cf"/><text x="1349" y="353" text-anchor="middle" fill="#202a33" font-size="12" font-weight="600">assessment ≠ source mutation</text><rect x="355" y="545" width="890" height="110" rx="18" fill="#dfe4e8" stroke="#b9c1c8" stroke-width="1.5"/><text x="800" y="582" text-anchor="middle" fill="#2f7f78" font-size="13" font-weight="700">PROVENANCE-AWARE VIEW MODEL</text><text x="800" y="616" text-anchor="middle" fill="#202a33" font-size="22" font-weight="700">Origins remain explicit in UI and exports</text><text x="800" y="643" text-anchor="middle" fill="#5f6b76" font-size="13">provenance · evidence · review state · semantic confidence are related, but not interchangeable</text><g stroke="#7a8793" stroke-width="2.5" fill="none"><path d="M220 390V500H560V535"/><path d="M590 390V500H700V535"/><path d="M970 480V515H900V535"/><path d="M1365 390V500H1040V535"/></g><g fill="#2f7f78"><path d="M560 535l-7-11h14z"/><path d="M700 535l-7-11h14z"/><path d="M900 535l-7-11h14z"/><path d="M1040 535l-7-11h14z"/></g><rect x="325" y="690" width="950" height="42" rx="11" fill="#dde2e6" stroke="#c3c9cf"/><text x="800" y="716" text-anchor="middle" fill="#5f6b76" font-size="14" font-weight="600">provenance ≠ confidence ≠ review ≠ physical truth</text></g></svg>