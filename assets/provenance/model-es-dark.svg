<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760"><rect width="1600" height="760" rx="22" fill="#11161d"/><g font-family="Segoe UI,Arial,sans-serif"><text x="48" y="46" fill="#a5b0ba" font-size="14" font-weight="700" letter-spacing="2">OTDR INSIDE · MODELO DE PROCEDENCIA DE EVENTOS</text><text x="48" y="80" fill="#f0f3f5" font-size="26" font-weight="700">Orígenes distintos pueden coexistir sin convertirse en el mismo tipo de evidencia</text><g stroke="#434d57" fill="#232931"><rect x="55" y="130" width="330" height="260" rx="18"/><rect x="425" y="130" width="330" height="260" rx="18"/><rect x="795" y="130" width="350" height="350" rx="18"/><rect x="1185" y="130" width="360" height="260" rx="18"/></g><text x="82" y="166" fill="#65d6c3" font-size="13" font-weight="700">ALMACENADO EN SOR</text><text x="82" y="201" fill="#f0f3f5" font-size="21" font-weight="700">Serializado en el SOR</text><text x="82" y="236" fill="#a5b0ba" font-size="14">Ejemplo: KeyEvents cuando existe</text><text x="82" y="270" fill="#a5b0ba" font-size="14">Origen = estructura del archivo fuente</text><text x="82" y="304" fill="#a5b0ba" font-size="14">Sin KeyEvents ≠ sin eventos ópticos</text><rect x="82" y="330" width="250" height="36" rx="10" fill="#1b2128" stroke="#434d57"/><text x="207" y="353" text-anchor="middle" fill="#f0f3f5" font-size="12" font-weight="600">el origen sigue siendo SOR</text><text x="452" y="166" fill="#d2ae68" font-size="13" font-weight="700">IMPORTADO DE EI</text><text x="452" y="201" fill="#f0f3f5" font-size="21" font-weight="700">Leído desde un EI soportado</text><text x="452" y="236" fill="#a5b0ba" font-size="14">EI independiente o compañero verificado</text><text x="452" y="270" fill="#a5b0ba" font-size="14">La pareja exige contenido + metadatos</text><text x="452" y="304" fill="#a5b0ba" font-size="14">Importar no sobrescribe los datos SOR</text><rect x="452" y="330" width="250" height="36" rx="10" fill="#1b2128" stroke="#434d57"/><text x="577" y="353" text-anchor="middle" fill="#f0f3f5" font-size="12" font-weight="600">el origen sigue siendo EI</text><text x="822" y="166" fill="#a48cff" font-size="13" font-weight="700">CALCULADO</text><text x="822" y="201" fill="#f0f3f5" font-size="21" font-weight="700">Derivado de la traza</text><text x="822" y="236" fill="#a5b0ba" font-size="14">Detector → contexto → evidencia</text><text x="822" y="270" fill="#a5b0ba" font-size="14">Los candidatos no son registros del equipo</text><rect x="822" y="307" width="296" height="132" rx="14" fill="#2a2437" stroke="#5d4e80"/><text x="846" y="338" fill="#a48cff" font-size="12" font-weight="700">v0.3.5 · EVIDENCIA TERMINAL</text><text x="846" y="370" fill="#f0f3f5" font-size="16" font-weight="700">Posible final no reflectivo</text><text x="846" y="399" fill="#a5b0ba" font-size="13">Solo si coinciden borde/caída/ruido</text><text x="846" y="424" fill="#a5b0ba" font-size="13">Si no, la región permanece como diagnóstico D</text><text x="1212" y="166" fill="#72b7ef" font-size="13" font-weight="700">REVISIÓN MANUAL</text><text x="1212" y="201" fill="#f0f3f5" font-size="21" font-weight="700">Evaluación humana</text><text x="1212" y="236" fill="#a5b0ba" font-size="14">pendiente · aceptado · rechazado</text><text x="1212" y="270" fill="#a5b0ba" font-size="14">Comentarios e historial por separado</text><text x="1212" y="304" fill="#a5b0ba" font-size="14">La revisión no reescribe la procedencia</text><rect x="1212" y="330" width="275" height="36" rx="10" fill="#1b2128" stroke="#434d57"/><text x="1349" y="353" text-anchor="middle" fill="#f0f3f5" font-size="12" font-weight="600">evaluación ≠ cambio de origen</text><rect x="355" y="545" width="890" height="110" rx="18" fill="#1b2128" stroke="#434d57" stroke-width="1.5"/><text x="800" y="582" text-anchor="middle" fill="#65d6c3" font-size="13" font-weight="700">MODELO DEL VISOR CON PROCEDENCIA</text><text x="800" y="616" text-anchor="middle" fill="#f0f3f5" font-size="22" font-weight="700">Los orígenes permanecen explícitos en la UI y las exportaciones</text><text x="800" y="643" text-anchor="middle" fill="#a5b0ba" font-size="13">procedencia · evidencia · estado de revisión · confianza semántica se relacionan, pero no son equivalentes</text><g stroke="#53677a" stroke-width="2.5" fill="none"><path d="M220 390V500H560V535"/><path d="M590 390V500H700V535"/><path d="M970 480V515H900V535"/><path d="M1365 390V500H1040V535"/></g><g fill="#65d6c3"><path d="M560 535l-7-11h14z"/><path d="M700 535l-7-11h14z"/><path d="M900 535l-7-11h14z"/><path d="M1040 535l-7-11h14z"/></g><rect x="325" y="690" width="950" height="42" rx="11" fill="#1b2128" stroke="#434d57"/><text x="800" y="716" text-anchor="middle" fill="#a5b0ba" font-size="14" font-weight="600">procedencia ≠ confianza ≠ revisión ≠ verdad física</text></g></svg>